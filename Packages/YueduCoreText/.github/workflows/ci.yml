name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Describe package
        run: swift package describe
      - name: Test on iOS Simulator
        run: |
          xcodebuild test \
            -scheme YueduCoreText \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            -parallel-testing-enabled NO
