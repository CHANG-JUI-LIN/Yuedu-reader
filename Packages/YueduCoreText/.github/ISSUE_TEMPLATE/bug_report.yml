name: Bug report
description: Report a reproducible typography or layout defect
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: YueduCoreText version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Xcode, OS, and device
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use distributable text or code; do not attach copyrighted books.
    validations:
      required: true
