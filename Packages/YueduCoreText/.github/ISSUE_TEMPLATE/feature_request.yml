name: Feature request
description: Propose a focused addition to the public package
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: use_case
    attributes:
      label: Reader use case
      description: Explain the problem and why it belongs in the reusable package.
    validations:
      required: true
  - type: textarea
    id: api
    attributes:
      label: Suggested API or behavior
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility considerations
      description: Note UTF-16 offsets, vertical writing, concurrency, and performance effects.
