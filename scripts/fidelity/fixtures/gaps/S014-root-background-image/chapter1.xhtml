<!DOCTYPE html>

<title>兩側的花邊</title>
<link rel="stylesheet" type="text/css" href="style.css"/>
</head>
<body class="strip">
<h2>兩側的花邊</h2>
<p>這一章的 body 有一張又寬又矮的花邊圖，寫的是 background-size: contain、background-repeat: repeat-y、background-position: left。圖要縮到和畫面一樣寬，然後一格接一格往下鋪滿，兩端的紋樣就成了左右兩條花邊。</p>
<p>如果引擎不看這三個屬性、一律把背景放大到蓋滿畫面，這張矮圖會被放大十幾倍，畫面上只剩幾條又粗又糊的黑條壓在字上。</p>
<p>正文沒有特別的樣式，換行和位置應該和對照組一樣，扣分應該全部落在畫面分。</p>
<p>最後一段。</p>
</body>
</html>
