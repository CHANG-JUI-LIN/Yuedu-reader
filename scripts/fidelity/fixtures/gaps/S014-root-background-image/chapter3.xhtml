<title>置中的大圖</title>
<link rel="stylesheet" type="text/css" href="style.css"/>
</head>
<body class="cover">
<h2>置中的大圖</h2>
<p>這一章的 body 寫的是 background-size: cover、background-position: center、background-repeat: no-repeat。圖比畫面寬得多，放大到蓋滿畫面的高度之後，左右兩邊各被切掉一樣多，畫面中間看到的應該是圖的中段（綠色）。</p>
<p>如果引擎把溢出的那一邊貼齊左邊，畫面上看到的會是圖的左段（紅色）。</p>
<p>最後一段。</p>
</body>
</html>
