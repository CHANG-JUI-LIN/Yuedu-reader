<h2>鋪滿的小圖</h2>
<p>這一章的 body 只寫了 background-image，沒有寫大小、位置和重複方式。照規格，圖用它自己的尺寸，從左上角開始往兩個方向重複，鋪滿整個畫面。</p>
<p>如果引擎把沒寫大小的背景也放大到蓋滿畫面，整頁只會看到一個放得很大的圓點。</p>
<p>最後一段。</p>
