<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="zh-Hant" xml:lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<title>空項與圖片</title>
<link rel="stylesheet" type="text/css" href="style.css"/>
</head>
<body>
<p class="note">中間一項是空的。</p>
<ol data-case="07-empty">
<li>前一項。</li>
<li></li>
<li>後一項。</li>
</ol>
<p class="note">無序清單的第一項是空的。</p>
<ul data-case="07-empty-ul">
<li></li>
<li>後一項。</li>
</ul>
<p class="note">第一項只有一張區塊圖片。</p>
<ol data-case="07-block-image">
<li><img class="block" src="plate-small.png" alt=""/></li>
<li>後一項。</li>
</ol>
<p class="note">第一項以行內圖片開頭。</p>
<ol data-case="07-inline-image">
<li><img src="mark.png" alt=""/>行內圖片開頭的一項。</li>
<li>後一項。</li>
</ol>
<p class="note">清單之後的正文。</p>
</body>
</html>
