<body>
<p>正文裡有兩個註腳<a id="fa1-back" href="#fa1">〔1〕</a>，註腳本身放在章末的清單裡<a id="fa2-back" href="#fa2">〔2〕</a>。</p>
<ol class="duokan-footnote-content" data-case="09-footnote-cjk">
<li class="duokan-footnote-item footnote-a" id="fa1"><a href="#fa1-back">第一條註腳用中文數字，字級是正文的九成，行高百分之百。</a></li>
<li class="duokan-footnote-item footnote-a" id="fa2"><a href="#fa2-back">第二條註腳寫得比較長，長到在這個寬度上一定會折行，看折行以後編號和文字的位置。</a></li>
</ol>
<p>另一種寫法<a id="fb1-back" href="#fb1">〔3〕</a>，項目有上下邊距和內距<a id="fb2-back" href="#fb2">〔4〕</a>。</p>
<ol class="duokan-footnote-content" data-case="09-footnote-decimal">
<li class="duokan-footnote-item footnote-b" id="fb1"> <a href="#fb1-back">第一條註腳用阿拉伯數字，行高百分之一百二十，上下各有內距。</a> </li>
<li class="duokan-footnote-item footnote-b" id="fb2"> <a href="#fb2-back">第二條註腳寫得比較長，長到在這個寬度上一定會折行，看折行以後編號和文字的位置。</a> </li>
