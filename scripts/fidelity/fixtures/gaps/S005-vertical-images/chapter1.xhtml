<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="zh-Hant" xml:lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<title>行內標記</title>
<link rel="stylesheet" type="text/css" href="style.css"/>
</head>
<body>
<p>批註本常在正文裡插入一個字大小的小圖<img src="mark.png" alt=""/>當作記號，告訴讀者這裡有一條眉批或夾批。</p>
<p>一章裡這樣的記號可以有幾十個<img src="mark.png" alt=""/>，有時一句話裡就出現兩次<img src="mark.png" alt=""/>，緊跟在某個字的後面<img src="mark.png" alt=""/>。</p>
<p>記號應該像一個字一樣佔住欄裡的位置<img src="mark.png" alt=""/>，前後的字照常排列，不會因為它而換欄。</p>
<p>如果引擎遇到圖就把整章交給舊引擎<img src="mark.png" alt=""/>，這一章量到的就是舊引擎的直排。</p>
<p>最後一段也放一個記號<img src="mark.png" alt=""/>。</p>
</body>
</html>
