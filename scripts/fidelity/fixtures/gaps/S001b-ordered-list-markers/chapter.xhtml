<title>有序清單</title>
</head>
<body>
<h2>有序清單</h2>
<p>下面是一份六項的有序清單，沒有任何作者樣式，編號和縮排全部來自瀏覽器的預設樣式。</p>
<ol>
<li>第一項很短。</li>
<li>第二項寫得比較長，長到在這個寬度上一定會折行，折下去的那一行要對齊文字，而不是對齊編號。</li>
<li>第三項。</li>
<li>第四項也稍微長一點，用來確認編號跟著每一項的第一行走。</li>
<li>第五項。</li>
<li>第六項是最後一項。</li>
</ol>
<p>清單之後還有一段正文，用來確認清單結束後的間距。</p>
</body>
</html>
