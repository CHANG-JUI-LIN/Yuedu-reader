<title>靠左的插圖</title>
<link rel="stylesheet" type="text/css" href="style.css"/>
</head>
<body>
<div class="ctleft"><img src="photo.png" width="85%" alt=""/><p class="caption">圖一　比賽現場</p></div>
<p>這張圖放在一個靠左浮動的容器裡，容器的寬度是正文的一半，圖片的寬度寫成百分之八十五，指的是容器寬度的百分之八十五。</p>
<p>正文從容器的右邊開始排，繞過圖片之後再回到整行的寬度。如果圖片只有應有寬度的一半，容器右側會空出一大塊，文字也會比對照組早一點繞回來。</p>
<p>這段文字寫得長一些，讓它一直排到圖片下方，才看得出繞排在哪一行結束、整行寬度從哪裡開始。比賽在晚上七點開始，觀眾提早一個小時就坐滿了看台，場邊的燈光把整個場地照得像白天一樣亮。</p>
<p>本章結束。</p>
</body>
</html>
