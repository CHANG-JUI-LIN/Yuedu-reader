<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="zh-Hant" xml:lang="zh-Hant">

<meta charset="UTF-8"/>
<title>米色的紙</title>
<link rel="stylesheet" type="text/css" href="style.css"/>
</head>
<body>
<h2>米色的紙</h2>
<p>這一章的背景色寫在 html 上，不是寫在 body 上。按照規格，根元素的背景要鋪滿整個畫面，連 body 外面那一圈 8 點的邊距也要是米色。</p>
<p>如果引擎只從 body 取背景，那一圈邊距就會是白的；如果連 body 都不取，整頁都會是白的。兩種情況在並排圖上一眼就看得出來。</p>
<p>正文本身沒有任何特別的樣式，換行和位置應該跟對照組完全一樣，所以這一章扣的分數應該全部落在畫面分。</p>
<p>最後一段。</p>
</body>
</html>
