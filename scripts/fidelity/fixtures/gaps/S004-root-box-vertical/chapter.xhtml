<meta charset="UTF-8"/>
<title>山路</title>
<link rel="stylesheet" type="text/css" href="style.css"/>
</head>
<body>
<p>山路一轉，霧就從谷底慢慢浮上來，先是遮住了遠處的樹梢，接著連腳下的石階也只剩模糊的輪廓。</p>
<p>走在前面的人停下來，回頭說再往上就是茶亭，到了那裡可以歇一歇，喝一碗熱茶再走。</p>
<p>我點點頭，沒有說話。這一路上想的事情太多，反而不知道該從哪一件開始說起，只好專心看著腳下。</p>
<p>每一欄的字數應該被限制在二十八個字的高度以內，上下留白相等；如果欄位一路排到畫面底部，就是根元素的盒子沒有生效。</p>
<p>茶亭裡只有一位老人，正在爐子邊添柴。他抬頭看了我們一眼，又低下頭去，好像這樣的客人每天都有。</p>
<p>霧還沒有散。</p>
</body>
</html>
