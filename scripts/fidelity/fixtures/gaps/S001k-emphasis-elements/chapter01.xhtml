<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="zh-Hant" xml:lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<title>傍點：元素與字體樣式</title>
<link rel="stylesheet" type="text/css" href="style.css"/>
</head>
<body>
<p data-m="p0">起點段落。</p>
<p data-m="a-p">甲<span class="fs" data-m="a" data-ink="emphasis">傍點</span>乙</p>
<p data-m="b-p">甲<em class="sesame_dot" data-m="b" data-ink="emphasis">傍點</em>乙</p>
<p data-m="c-p">甲<span class="sesame_dot" data-m="c" data-ink="emphasis">傍點</span>乙</p>
<p data-m="d-p">甲<em class="fs" data-m="d" data-ink="emphasis">傍點</em>乙</p>
<p data-m="e-p">甲<span class="fs ni" data-m="e" data-ink="emphasis">傍點</span>乙</p>
<p data-m="f-p">甲<span class="fs it" data-m="f" data-ink="emphasis">傍點</span>乙</p>
<p data-m="g-p">甲<i class="fs" data-m="g" data-ink="emphasis">傍點</i>乙</p>
<p data-m="h-p">甲<b class="fs" data-m="h" data-ink="emphasis">傍點</b>乙</p>
<p data-m="i-p">甲<em class="fs ni" data-m="i" data-ink="emphasis">傍點</em>乙</p>
<p data-m="j-p">甲<strong class="fs" data-m="j" data-ink="emphasis">傍點</strong>乙</p>
<p data-m="after">之後。</p>
</body>
</html>
