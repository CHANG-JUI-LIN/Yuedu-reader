name: Reader CoreText Gates

on:
  workflow_dispatch:
  pull_request:

jobs:
  reader-coretext:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout repository without token
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags --prune --depth=1 origin "refs/pull/${PR_NUMBER}/merge"
          else
            git fetch --no-tags --prune --depth=1 origin "$GITHUB_REF"
          fi
          git checkout --force FETCH_HEAD
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Whitespace check
        run: git diff --check

      - name: Localization plist lint
        run: find iOS -name Localizable.strings -print0 | xargs -0 plutil -lint

      - name: Create non-secret Firebase build fixture
        run: |
          plutil -create xml1 GoogleService-Info.plist
          plutil -insert API_KEY -string "AIzaSyAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA" GoogleService-Info.plist
          plutil -insert CLIENT_ID -string "000000000000-ci.apps.googleusercontent.com" GoogleService-Info.plist
          plutil -insert REVERSED_CLIENT_ID -string "com.googleusercontent.apps.000000000000-ci" GoogleService-Info.plist
          plutil -insert GCM_SENDER_ID -string "000000000000" GoogleService-Info.plist
          plutil -insert PLIST_VERSION -string "1" GoogleService-Info.plist
          plutil -insert BUNDLE_ID -string "com.yuedu.reader.ci" GoogleService-Info.plist
          plutil -insert PROJECT_ID -string "yuedu-reader-ci" GoogleService-Info.plist
          plutil -insert STORAGE_BUCKET -string "yuedu-reader-ci.appspot.com" GoogleService-Info.plist
          plutil -insert IS_ADS_ENABLED -bool false GoogleService-Info.plist
          plutil -insert IS_ANALYTICS_ENABLED -bool false GoogleService-Info.plist
          plutil -insert IS_APPINVITE_ENABLED -bool false GoogleService-Info.plist
          plutil -insert IS_GCM_ENABLED -bool false GoogleService-Info.plist
          plutil -insert IS_SIGNIN_ENABLED -bool false GoogleService-Info.plist
          plutil -insert GOOGLE_APP_ID -string "1:000000000000:ios:0000000000000000000000" GoogleService-Info.plist
          plutil -lint GoogleService-Info.plist

      - name: Build app
        run: |
          xcodebuild build \
            -project Yuedu-Reader.xcodeproj \
            -scheme Yuedu-Reader \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro Max' \
            -configuration Debug

      - name: Focused reader tests
        run: |
          xcodebuild test \
            -project Yuedu-Reader.xcodeproj \
            -scheme Yuedu-Reader \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro Max' \
            -only-testing:"yuedu appTests/ReaderPresentationContractTests" \
            -only-testing:"yuedu appTests/ReaderEngineContractTests" \
            -only-testing:"yuedu appTests/ProgrammaticPageTransitionPerformerTests" \
            -only-testing:"yuedu appTests/ReaderPageTransitionQueueTests" \
            -only-testing:"yuedu appTests/CoreTextCFIProgressTests"
